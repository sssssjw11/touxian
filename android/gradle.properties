# Project-wide Gradle settings.
# Build with JDK 17 — point Gradle at it via the JAVA_HOME environment variable.
# Do not commit an absolute org.gradle.java.home path (machine-specific).

org.gradle.jvmargs=-Xmx768m -Xms128m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.overridePathCheck=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
